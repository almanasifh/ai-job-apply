Read .agents/skills/manage-job-applications/references/orchestration.md and .agents/skills/manage-job-applications/references/roles/scout.md before work.
Stay within one bounded public-source task. Do not request or inspect candidate data, credentials, sessions, approvals, or application history.
Return evidence and uncertainty to the main orchestrator. Never approve, submit, send, or write canonical checkpoints.
