name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q .agents/skills/manage-job-applications/scripts scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build release packages
        run: |
          python scripts/build_portable.py
          python scripts/stage_plugin.py

      - name: Validate release and evaluations
        run: |
          python scripts/validate_release.py
          python scripts/validate_evals.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Test on Python 3.12
        run: |
          python -m compileall -q .agents/skills/manage-job-applications/scripts scripts tests
          python -m unittest discover -s tests -v

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Test on Python 3.13
        run: |
          python -m compileall -q .agents/skills/manage-job-applications/scripts scripts tests
          python -m unittest discover -s tests -v

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Test on Python 3.14
        run: |
          python -m compileall -q .agents/skills/manage-job-applications/scripts scripts tests
          python -m unittest discover -s tests -v
